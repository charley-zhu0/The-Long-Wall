version: '3.9'

services:
  game-server:
    build: .
    ports:
      - '2567:2567'
    environment:
      - PORT=2567
      - NODE_ENV=production
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./client/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - game-server
    restart: unless-stopped
