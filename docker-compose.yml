version: '3.9'

services:
  game-server:
    build: .
    ports:
      - '2567:2567'
    environment:
      - PORT=2567
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=512
    deploy:
      resources:
        limits:
          memory: 600m
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./client/dist:/usr/share/nginx/html:ro
      - ./nginx-ssl.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - game-server
    restart: unless-stopped
